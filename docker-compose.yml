# Production-shaped stack: poietic-issues on Postgres with S3-compatible object storage (SeaweedFS).
#   docker compose up -d --build
#   docker compose exec poietic-issues poietic-issues-admin db bootstrap --handle you --name "Your Name"
# poietic-issues-admin is the operator tool: it runs the CLI's commands in-process on the container's database.
services:
  poietic-issues:
    build: .
    ports: ['3000:3000']
    environment:
      POIETIC_ISSUES_DATABASE_URL: postgres://tracker:tracker@postgres:5432/tracker
      POIETIC_ISSUES_BLOB_STORE: s3
      POIETIC_ISSUES_S3_ENDPOINT: http://seaweedfs:8333
      POIETIC_ISSUES_S3_BUCKET: tracker
      POIETIC_ISSUES_S3_ACCESS_KEY_ID: tracker
      POIETIC_ISSUES_S3_SECRET_ACCESS_KEY: tracker-secret
      # The object store is internal to this network, so downloads stream through the server instead of redirecting.
      POIETIC_ISSUES_S3_PRESIGN: '0'
      # Behind TLS in real deployments; plain http here, so cookies must not be Secure-only.
      POIETIC_ISSUES_SECURE_COOKIES: '0'
    depends_on:
      postgres: { condition: service_healthy }
      seaweedfs-init: { condition: service_completed_successfully }
    restart: unless-stopped

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: tracker
      POSTGRES_PASSWORD: tracker
      POSTGRES_DB: tracker
    volumes: [postgres:/var/lib/postgresql/data]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U tracker']
      interval: 5s
      retries: 20

  # S3-compatible object storage (any S3 service works: AWS S3, R2, SeaweedFS, …).
  seaweedfs:
    image: chrislusf/seaweedfs
    command: server -dir=/data -s3 -s3.config=/etc/seaweedfs/s3.json
    volumes:
      - seaweedfs:/data
      - ./deploy/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro

  # Creates the bucket once the storage is up (retrying until it is).
  seaweedfs-init:
    image: chrislusf/seaweedfs
    depends_on: [seaweedfs]
    entrypoint: >
      sh -c 'for i in $$(seq 60); do
        echo "s3.bucket.create -name tracker" | weed shell -master=seaweedfs:9333 2>&1 | grep -qE "created|already exists" && exit 0;
        sleep 2; done; exit 1'

volumes:
  postgres:
  seaweedfs:
