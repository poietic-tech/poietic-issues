name: Deploy

# Deploys to Cloudflare (issues.poietic.tech) after CI passes on main.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    if: |
      github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
      || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build the poietic-issues base image
        run: docker build -t poietic-issues:local .
      - name: Set Worker secrets
        working-directory: deploy/cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          POIETIC_AUTH_SERVICE_KEY: ${{ secrets.POIETIC_AUTH_SERVICE_KEY }}
        run: |
          for s in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY POIETIC_AUTH_SERVICE_KEY; do
            [ -n "${!s}" ] || { echo "::error::secret $s is empty"; exit 1; }
          done
          jq -n --arg id "$R2_ACCESS_KEY_ID" --arg secret "$R2_SECRET_ACCESS_KEY" --arg dir "$POIETIC_AUTH_SERVICE_KEY" \
            '{R2_ACCESS_KEY_ID: $id, R2_SECRET_ACCESS_KEY: $secret, SSO_DIRECTORY_KEY: $dir}' |
            pnpm exec wrangler secret bulk
      - name: Deploy
        working-directory: deploy/cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler deploy --var "R2_ENDPOINT:https://${CLOUDFLARE_ACCOUNT_ID}.r2.cloudflarestorage.com"
      # /readyz, not /healthz: ready means the tracker can query its database (restored from R2 on a fresh disk). A cold
      # start (image pull, restore, migrations) can take minutes, so allow ~10 minutes.
      - name: Smoke check
        run: |
          for i in $(seq 60); do
            curl -fsS --max-time 10 -o /dev/null https://issues.poietic.tech/readyz && exit 0
            sleep 10
          done
          echo "::error::issues.poietic.tech did not become ready"; exit 1
